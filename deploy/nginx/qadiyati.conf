# nginx for Qadiyati on the Proxmox server.
#
# Only the Cloudflare Tunnel (cloudflared, on this same machine) talks to nginx, so it listens on
# 127.0.0.1 alone: nothing on the home network or the internet can reach it directly. Visitors
# arrive at https://qadiyati.ps through Cloudflare, which handles HTTPS.
#
# Install:  sudo cp qadiyati.conf /etc/nginx/sites-available/qadiyati
#           sudo ln -s /etc/nginx/sites-available/qadiyati /etc/nginx/sites-enabled/qadiyati
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx

# The visitor's real address. Cloudflare sends CF-Connecting-IP; Tailscale Funnel sends
# X-Forwarded-For. Only the local tunnel programs can reach this nginx (it listens on 127.0.0.1),
# so these headers come from them, not from visitors.
map $http_cf_connecting_ip $qadiyati_client_ip {
    ""      $http_x_forwarded_for;
    default $http_cf_connecting_ip;
}

server {
    listen 127.0.0.1:8080;
    server_name qadiyati.ps www.qadiyati.ps;

    # The built frontend (npm run build in frontend/).
    root /opt/qadiyati/frontend/dist;
    index index.html;

    # PDF documents and receipts: the API itself caps uploads (DOCUMENT_MAX_BYTES, at most 50 MiB).
    client_max_body_size 55m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # The API (Node on port 3000, run by systemd as qadiyati-api).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's real address (see the map above). It overwrites whatever the visitor sent,
        # and the API trusts it only because it comes from this local proxy (TRUST_PROXY=loopback).
        proxy_set_header X-Real-IP $qadiyati_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # AI hearing preparation can take a while
        proxy_request_buffering off;
    }

    # Fingerprinted build files never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The single-page app: every other path opens index.html, which must never be cached so a new
    # release is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
